AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Nimbus backend — FastAPI on Lambda behind an HTTP API Gateway.
  Native CloudFormation (no SAM transform) so deploys need only
  cloudformation permissions scoped to stack/nimbus-*.

Parameters:
  MongoDbUrl:
    Type: String
    NoEcho: true
  JwtSecret:
    Type: String
    NoEcho: true
  S3BucketName:
    Type: String
  CorsOrigins:
    Type: String
    Default: http://localhost:3000
  CodeS3Bucket:
    Type: String
    Description: Bucket holding the deployment zip.
  CodeS3Key:
    Type: String
    Description: Key of the deployment zip; change to trigger a code update.

Resources:
  NimbusFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: nimbus-api
      Runtime: python3.13
      Handler: app.lambda_handler.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/nimbus-lambda-exec
      # Lambda scales CPU with memory; 512MB keeps cold starts tolerable
      # while staying far inside the free tier's 400,000 GB-seconds.
      MemorySize: 512
      Timeout: 30
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          MONGODB_URL: !Ref MongoDbUrl
          MONGODB_DB_NAME: nimbus
          JWT_SECRET_KEY: !Ref JwtSecret
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
          S3_BUCKET_NAME: !Ref S3BucketName
          S3_REGION: !Ref AWS::Region
          PRESIGNED_URL_EXPIRE_SECONDS: "3600"
          CORS_ORIGINS: !Ref CorsOrigins

  # Retain logs for a week only — indefinite retention is the usual way a
  # "free" serverless stack quietly starts costing money.
  NimbusLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/nimbus-api
      RetentionInDays: 7

  NimbusHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: nimbus-api
      ProtocolType: HTTP
      # CORS is handled by FastAPI's middleware; configuring it here too
      # would emit duplicate headers, which browsers reject.

  NimbusIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref NimbusHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${NimbusFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  NimbusRouteRoot:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NimbusHttpApi
      RouteKey: ANY /
      Target: !Sub integrations/${NimbusIntegration}

  NimbusRouteProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NimbusHttpApi
      RouteKey: ANY /{proxy+}
      Target: !Sub integrations/${NimbusIntegration}

  NimbusStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref NimbusHttpApi
      StageName: $default
      AutoDeploy: true

  NimbusInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NimbusFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NimbusHttpApi}/*

Outputs:
  ApiUrl:
    Description: Public base URL of the Nimbus API.
    Value: !Sub https://${NimbusHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  FunctionName:
    Value: !Ref NimbusFunction
